<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeGalería</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mi Galeria Pokemon</h1>

    <div class="controles">
        <input type="text" id="busq" placeholder="Buscar Pokémon por nombre...">
        <button id="b">Buscar</button>
        <button id="limpiar">Borrar Busqueda</button>
    </div>

    <div id="gal" class="galeria">
        </div>

    <div class="paginacion">
        <button id="ant" disabled>Anterior</button>
        <span id="p">Pagina: 1</span>
        <button id="sig">Siguiente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
